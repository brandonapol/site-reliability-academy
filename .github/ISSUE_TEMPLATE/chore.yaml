name: Chore / Maintenance
description: Dependency updates, refactors, CI changes, tooling, cleanup — work that doesn't change what learners see.
title: 'chore: '
labels: ['chore']
assignees: []
body:
  - type: dropdown
    id: chore-type
    attributes:
      label: Type of chore
      multiple: false
      options:
        - Dependency update
        - Refactor / cleanup
        - CI / tooling
        - Documentation
        - Test coverage
        - Performance
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs doing?
      description: Describe the work. Link changelogs, related PRs, or whatever triggered it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now?
      description: Is this blocking something? Routine hygiene? Optional but helpful.
