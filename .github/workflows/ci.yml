name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The merge queue runs every job on the pull request combined with main and whatever is
  # queued ahead of it, so a pull request does not have to be up to date to merge.
  merge_group:
  workflow_dispatch:
# Cancels only superseded runs of the same pull request. Push, merge-queue and manual runs
# each get a group of their own, so none of them is ever canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Check formatting
        run: make check/format
      - name: Lint
        run: make check/lint
      - name: Type-check
        run: make check/types
      - name: Unit tests
        run: make test/unit
      - name: Build
        run: make build
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  check-misc:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's, so contents: read is repeated.
    # pull-requests: read is what lets check/attribution read the pull request.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Spellcheck
        run: make check/spelling
      - name: Test the commit hooks
        run: make test/check/fast
      # Merge queue, push and manual runs have no pull request to read, so they skip this.
      - name: Check for AI attribution
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make check/attribution PR=${{ github.event.pull_request.number }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: make test/e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Publishes the site to GitHub Pages (#46) once every check above has passed on `main`. Pull
  # requests run the checks but never deploy. One-time setup: Settings → Pages → Source: GitHub
  # Actions.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, check-misc, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: ./.github/actions/setup-node
      # Builds both pages (index.html and play.html) under /site-reliability-academy/, the
      # project-site path; set BASE_PATH here to deploy somewhere else.
      - name: Build
        run: make build
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
